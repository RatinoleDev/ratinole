# Nginx site for the VPS. Replace every example.com with the real domain, e.g.
#   sed 's/example\.com/ratinole.trade/g' deploy/nginx.conf > /etc/nginx/sites-available/ratinole
# Get the certificate first (docs/deploy.md). /api goes straight to the API on
# 127.0.0.1:4000; everything else to Next on 127.0.0.1:3000. www redirects to the
# bare domain, because wallet sign-in is bound to one host (APP_ORIGIN).

limit_req_zone $binary_remote_addr zone=rationale_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=rationale_auth:10m rate=30r/m;
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://example.com$request_uri; }
}

server {
    # "listen ... ssl http2" works on nginx 1.18-1.24 (Ubuntu 22.04/24.04).
    # On nginx 1.25.1+ use "listen 443 ssl;" plus "http2 on;" instead.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.example.com;
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    return 301 https://example.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;
    client_max_body_size 64k;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Sign-in: a few attempts per minute per address.
    location /api/auth/ {
        limit_req zone=rationale_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:4000;
    }

    location /api/ {
        limit_req zone=rationale_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:4000;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
