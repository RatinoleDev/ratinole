name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rationale
          POSTGRES_PASSWORD: rationale
          POSTGRES_DB: rationale_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rationale"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Throwaway CI database; no real secrets are needed to test.
      DATABASE_URL: postgresql://rationale:rationale@localhost:5432/rationale_test
      TEST_DATABASE_URL: postgresql://rationale:rationale@localhost:5432/rationale_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:deploy
      - name: Lint
        run: pnpm lint
      - name: Type-check
        run: pnpm typecheck
      - name: Unit and integration tests
        run: pnpm test
      - name: Build the web app
        run: pnpm --filter @rationale/web build
        env:
          # No API in CI: the landing page renders its empty states.
          API_INTERNAL_URL: http://127.0.0.1:9
      - name: Install a browser for smoke tests
        run: pnpm --filter @rationale/web exec playwright install --with-deps chromium
      - name: Web smoke tests
        run: pnpm --filter @rationale/web test:e2e
