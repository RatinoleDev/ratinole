# Local development only: Postgres and Redis.
# The password below is a throwaway for a database that listens on localhost.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rationale
      POSTGRES_PASSWORD: rationale
      POSTGRES_DB: rationale
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
volumes:
  pgdata:
